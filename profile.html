<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile</title>
  <link rel="stylesheet" href="dashboard.css" />
</head>
<body>
  <div class="dashboard-container">
    <!-- Title -->
    <h1 class="dashboard-title">Your Profile</h1>

    <!-- Profile Information -->
   <div class="profile-info">
  <p><strong>Name:</strong> <span id="profileName">Empty</span></p>
  <p><strong>Email:</strong> <span id="profileEmail">Empty</span></p>
  <p><strong>Phone:</strong> <span id="profilePhone">Empty</span></p>
  <p><strong>Registered On:</strong> <span id="profileDate">Empty</span></p>
</div>

    <!-- Buttons -->
    <div class="button-group">
      <button onclick="goToPage('dashboard.html')" class="btn-primary"> Back to Dashboard</button>
     
    </div>
  </div>

  <!-- Link to JS -->
  <script src="profile.js" defer></script>
</body>
</html>
